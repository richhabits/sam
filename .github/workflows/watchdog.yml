name: Health Watchdog
# Runs the full health suite on main every day and OPENS A LABELED ISSUE if anything's wrong — so the
# repo tells the maintainer it's rotting instead of rotting silently. Free (one ubuntu run/day).
on:
  schedule:
    - cron: "0 8 * * *"   # daily 08:00 UTC
  workflow_dispatch:
permissions:
  contents: read
jobs:
  health:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write        # to file the alert
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # mobile/ has its own package.json/node_modules — its tests extend expo/tsconfig.base,
      # which only resolves once mobile/'s own deps are installed. Same fix as ci.yml's
      # `npm ci --prefix mobile` step; this workflow never got it, so every mobile/* test file
      # failed to even load here (20 suites), independently of whatever this run was checking.
      - run: npm ci --prefix mobile
      - name: Lint · types · tests · build
        run: npm run lint && npx tsc --noEmit && npm test && npm run build
      # Same reason as ci.yml's identical step: mobile/ has its own tsconfig (extends
      # expo/tsconfig.base) and was never in the root config's `include`, so the line above
      # never checked it.
      - name: Type-check the mobile app (its own tsconfig — root doesn't cover it)
        run: npx tsc --noEmit
        working-directory: mobile
      - name: Dependency audit (high/critical fail) — RUNTIME deps only
        # AUDIT FIX: scope to what actually SHIPS. --omit=dev excludes build-only tooling
        # (electron-builder & co., whose transitive advisories like ejs/brace-expansion run only in
        # CI during packaging, never on a user's machine) so the gate flags REAL user-facing risk
        # rather than failing red on un-shippable build-tool noise. Dev-dep advisories are tracked
        # separately (bump electron-builder when the build pipeline is next touched).
        run: npm audit --omit=dev --audit-level=high
      - name: Advertised stats not drifted
        run: |
          npm run stats
          git diff --exit-code docs/stats.json README.md || { echo "::error::stats drifted"; exit 1; }
      # AUDIT FIX: removed an UNPINNED gitleaks/gitleaks-action@v2 that ran with GITHUB_TOKEN — the
      # dedicated secret-scan.yml workflow already runs gitleaks over full history with a
      # checksum-verified binary, so this was redundant third-party-action exposure.
      # On ANY failure above → open (or reuse) a dated alert issue so it's impossible to miss.
      - name: Open an alert issue on failure
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const title = `🚨 Health watchdog failed — ${new Date().toISOString().slice(0,10)}`;
            const body = `The daily health watchdog failed. See the run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nSomething on \`main\` needs attention (lint / types / tests / build / audit / stats-drift / secrets).`;
            const existing = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: "open", labels: "watchdog" });
            if (existing.data.length === 0) {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ["watchdog", "ci"] });
            }

  # Born from a real incident: two weeks of verified fixes shipped to main and sat there —
  # nobody was told, so nobody cut a release, and every installed app stayed two weeks stale
  # on auto-update. This only NAGS; cutting a release stays a human act (npm run release:app).
  release-staleness:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }   # needs full tag + commit history, not the default shallow clone
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - name: Check commits-since-last-tag
        id: check
        run: |
          node scripts/release-staleness.mjs > staleness.json
          cat staleness.json
          echo "json=$(cat staleness.json)" >> "$GITHUB_OUTPUT"
      - name: Nag (or clear the nag) via a labeled issue
        uses: actions/github-script@v9
        with:
          script: |
            const s = JSON.parse(${{ toJSON(steps.check.outputs.json) }});
            const existing = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: "open", labels: "release-stale" });
            if (s.stale) {
              const title = `📦 Release overdue — ${s.userVisibleCommits} commits, ${s.days} days since ${s.tag}`;
              const body = `\`main\` has ${s.userVisibleCommits} user-visible commits (${s.totalCommits} total) since the last tagged release, \`${s.tag}\`, cut ${s.days} days ago. Installed apps on auto-update are ${s.days} days behind what's actually on main.\n\nThis issue only nags — cutting the release is still a human call: \`npm run release:app\` (or tag + \`gh release create\` for the full signed matrix). Closes itself automatically once a new tag lands.`;
              if (existing.data.length === 0) {
                await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ["release-stale", "ci"] });
              } else {
                await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.data[0].number, title, body });
              }
            } else {
              for (const issue of existing.data) {
                await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number, state: "closed" });
                await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number, body: `Resolved — \`${s.tag}\` is now current.` });
              }
            }
