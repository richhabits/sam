# ─────────────────────────────────────────────────────────────
#  Build SAM desktop apps — Mac (.dmg) + Windows (.exe installer)
#
#  Each platform builds on its OWN runner because the native module
#  (better-sqlite3) can't be cross-compiled — its .node must be built
#  on-platform, FROM SOURCE, against Electron's ABI (npmRebuild is off
#  in package.json, so we do that rebuild explicitly here).
#
#  Triggers:
#   • Publish a GitHub Release → builds, PROVES THE APP STARTS, then attaches
#     the installers (auto-update picks them up). Note there is no `push: tags`
#     trigger despite what this header used to claim — a tag alone builds nothing.
#   • Run manually (workflow_dispatch) → builds + uploads artifacts you
#     can download from the run, without touching a release.
#
#  ORDER MATTERS, and it is the whole point of this file: package → smoke test →
#  notarization check → publish. Packaging used to carry `--publish always`, so the
#  installers were uploaded BEFORE anything checked the app could launch. v3.2.0 went
#  out that way and died before its first window on two platforms.
#
#  Code signing is OPTIONAL — set these repo secrets to ship signed
#  (unsigned still builds fine, users just click through Gatekeeper):
#   Mac:  CSC_LINK (base64 .p12), CSC_KEY_PASSWORD, and for notarizing
#         APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID
#   Win:  WIN_CSC_LINK (base64 .pfx), WIN_CSC_KEY_PASSWORD
# ─────────────────────────────────────────────────────────────
name: Build Desktop Apps

on:
  release:
    types: [published]   # publish a release → build + attach installers to it
  workflow_dispatch:      # run manually → build + upload artifacts (or publish to a release)
    inputs:
      publish:
        description: "Attach installers to the release for this version (must already exist)"
        type: boolean
        default: false
# Serialise per release/ref, but NEVER cancel an in-flight release build (signing/notarization must finish).
concurrency:
  group: build-desktop-${{ github.ref }}
  cancel-in-progress: false

# AUDIT FIX: least privilege by default — top-level READ so test-gate / install-test can't write.
# Only the jobs that publish (build, checksums) get contents:write at the job level.
permissions:
  contents: read

jobs:
  # RELEASE GATE — tests + type-check must pass before ANY installer is built or published.
  # Standalone so ALL build legs (mac arm64/x64, win, linux) depend on it — not just one matrix leg.
  test-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The Pocket's tests live in the SAME vitest run (mobile/lib/*.test.ts) but its tsconfig
      # extends expo/tsconfig.base, which only resolves inside mobile/node_modules. Without this
      # they don't fail loudly as "missing deps" — they fail as TSCONFIG_ERROR transform errors,
      # which reads like broken test code. Cheap here (11 deps, ubuntu runner), and the
      # alternative — excluding mobile/ from the root config — would silently stop running the
      # phone's scrubber tests, which are the ones covering redaction of key-shaped strings.
      - run: npm ci --prefix mobile
      - name: Test + type-check
        run: |
          npm test
          npx tsc --noEmit

  build:
    needs: test-gate   # no installer builds or publishes unless the gate is green
    permissions:
      contents: write   # this job attaches installers to the release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest      # Apple Silicon Macs
            platform: mac
            arch: arm64
          - os: macos-latest      # Intel Macs — CROSS-built on the (plentiful) arm64 runner, so we
            platform: mac          # never wait on the scarce macos-13 Intel runner.
            arch: x64
          - os: windows-latest     # Windows
            platform: win
            arch: x64
          - os: ubuntu-latest      # Linux (AppImage + .deb — both are electron-builder targets)
            platform: linux
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # (Tests + type-check now run once in the standalone `test-gate` job above, which every
      #  build leg depends on — so a red build can never ship any installer.)
      - name: Build web + server bundles
        run: npm run build

      - name: Rebuild native modules for Electron (from source, target arch)
        run: npx @electron/rebuild --force --build-from-source --only better-sqlite3 --arch ${{ matrix.arch }}

      # Signs + notarizes AUTOMATICALLY when the Apple secrets are present, otherwise builds unsigned.
      # No workflow edits needed — add the repo secrets (CSC_LINK, CSC_KEY_PASSWORD, APPLE_ID,
      # APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID) and the very next release signs itself.
      # PACKAGE ONLY — never publish here. This step used to carry `--publish always`, which meant
      # electron-builder uploaded the installers BEFORE anything had checked the app could start.
      # v3.2.0 shipped exactly that way: the packaging succeeded, the installers went to the
      # release, and the smoke test then failed because better-sqlite3 13 had moved its native
      # binary and the packaged app died before its first window. The release was public, marked
      # latest, and serving an auto-update feed for the fifteen minutes it took to notice.
      #
      # Uploading is now a separate step AFTER the smoke test and the notarization check, so a
      # build that does not start cannot reach a release at all.
      - name: Package (${{ matrix.platform }} ${{ matrix.arch }})
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIGN_CSC_LINK: ${{ secrets.CSC_LINK }}
          SIGN_CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WIN_SIGN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_SIGN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if [ "${{ matrix.platform }}" = "mac" ] && [ -n "$SIGN_CSC_LINK" ]; then
            export CSC_LINK="$SIGN_CSC_LINK" CSC_KEY_PASSWORD="$SIGN_CSC_KEY_PASSWORD"
            echo "🔏 macOS: signing + notarizing (Developer ID cert + notarization creds present)"
          elif [ "${{ matrix.platform }}" = "win" ] && [ -n "$WIN_SIGN_CSC_LINK" ]; then
            export CSC_LINK="$WIN_SIGN_CSC_LINK" CSC_KEY_PASSWORD="$WIN_SIGN_CSC_KEY_PASSWORD"
            echo "🔏 Windows: signing"
          else
            # No cert secret → force-disable auto-discovery so an empty CSC_LINK can't crash the build.
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            echo "ℹ️ ${{ matrix.platform }}: unsigned build (no signing secrets set)"
          fi
          npx electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never

      # RUNTIME PROOF (no false claims): actually launch the packaged app on THIS platform and
      # confirm the embedded server boots + responds. This exercises the real risks — the native
      # better-sqlite3 binding loading per-platform + the writable data dir — not just "it compiled".
      # Only smoke-test where the RUNNER arch matches the BUILD arch, so the app runs natively and
      # the result is honest. The mac-x64 build is cross-compiled on an arm64 runner — running it
      # here would only exercise Rosetta (Chromium's network service crashes under emulation), which
      # is NOT how a real Intel Mac behaves. Intel is build-verified; true runtime proof needs Intel HW.
      # Smoke only where the runner arch matches natively: win-x64 + mac-arm64. mac-x64 (cross-built,
      # Rosetta) and linux-AppImage (needs a display server) are build-verified; the install-test job
      # covers their runtime.
      - name: Smoke test — boot the packaged app + hit the server
        if: ${{ matrix.platform == 'win' || (matrix.platform == 'mac' && matrix.arch == 'arm64') }}
        shell: bash
        run: |
          set +e
          if [ "${{ matrix.platform }}" = "mac" ]; then
            APP=$(find dist-app -path '*SAM.app/Contents/MacOS/*' -type f | head -1)
          else
            APP=$(find dist-app -iname 'SAM.exe' -path '*unpacked*' | head -1)
          fi
          echo "Launching: $APP"
          if [ -z "$APP" ]; then echo "❌ could not locate the packaged binary under dist-app:"; find dist-app -maxdepth 2 -type d; exit 1; fi
          # SAM_YARD=1 IS THE WHOLE POINT OF THIS LINE.
          #
          # This smoke test booted the app with the yard OFF, so it never opened a database — and
          # SQLite is exactly what breaks in a packaged build, because the bundler ignores
          # `external` and better-sqlite3 then hunts for its native binary inside the read-only
          # app.asar. v3.3.0 passed this step green and shipped an app that died with
          # "Cannot find module .../app.asar/build/Release/better_sqlite3.node" the moment anyone
          # switched the yard on. A smoke test that never touches the database cannot see the one
          # failure that has now sunk two releases.
          #
          # SAMYARD_DIR keeps it in the workspace so the runner's home stays clean.
          export SAM_YARD=1
          export SAMYARD_DIR="$PWD/smoke-yard"
          # RUN IT FROM SOMEWHERE THAT IS NOT THE CHECKOUT.
          #
          # The yard supervisor deliberately prefers (worker.ts + node_modules/.bin/tsx) when it
          # can find them, so a checkout never runs a stale bundle. On a runner the app's cwd IS
          # the checkout, so the packaged app took that developer path — meaning this smoke test
          # was exercising the repo's TypeScript worker, not the yard-worker.mjs a user actually
          # gets. It passed on mac for that reason, and only failed on Windows because the
          # extensionless .bin/tsx is not spawnable there. A user has no checkout, so neither
          # outcome told us anything about the shipped app.
          WORKDIR="$RUNNER_TEMP/sam-smoke"; mkdir -p "$WORKDIR"
          LOG="$PWD/smoke.log"
          APP="$(cd "$(dirname "$APP")" && pwd)/$(basename "$APP")"
          ( cd "$WORKDIR" && "$APP" > "$LOG" 2>&1 & )
          UP=0
          for i in $(seq 1 30); do
            if curl -s -m3 http://127.0.0.1:8787/api/status -o /dev/null; then UP=1; break; fi
            sleep 3
          done
          # Wait for the yard to open its store BEFORE killing the app. The worker is spawned
          # asynchronously — the first version of this check ran in the same millisecond as the
          # "worker starting" line and failed a build whose yard was perfectly healthy. Poll for
          # the artefact instead of guessing at a delay.
          DB=0
          for i in $(seq 1 20); do
            if [ -f "$SAMYARD_DIR/state/jobs.db" ]; then DB=1; break; fi
            sleep 2
          done
          echo "----- app boot log -----"; tail -25 "$LOG" 2>/dev/null
          taskkill //F //IM SAM.exe >/dev/null 2>&1; pkill -f 'SAM' >/dev/null 2>&1; true
          if [ "$UP" != "1" ]; then
            echo "❌ ${{ matrix.platform }}-${{ matrix.arch }}: server did NOT respond — see log above."; exit 1
          fi
          # A responding server is not proof of a healthy one: preboot.ts catches uncaughtException
          # and logs it rather than exiting, so the app can answer /api/status while its database
          # layer is dead. That is precisely how v3.3.0 looked green here.
          if grep -qiE "uncaughtException|Cannot find module.*better_sqlite3" "$LOG"; then
            echo "❌ ${{ matrix.platform }}-${{ matrix.arch }}: the app booted but threw on startup:"
            grep -iE "uncaughtException|Cannot find module.*better_sqlite3" "$LOG" | head -5
            exit 1
          fi
          # A yard with no worker is not a working yard: the store opens, the API answers, and no
          # job ever runs. The supervisor says so plainly and then backs off, so this line is the
          # only evidence — and it sat in a green build's log until it was asserted on.
          if grep -qi "no worker entrypoint" "$LOG"; then
            echo "❌ ${{ matrix.platform }}-${{ matrix.arch }}: the yard could not find its worker bundle — jobs would queue forever."
            grep -i "yard" "$LOG" | head -5
            exit 1
          fi
          # And prove the yard actually opened its store, rather than merely not crashing.
          if [ "$DB" != "1" ]; then
            echo "❌ ${{ matrix.platform }}-${{ matrix.arch }}: the yard never created its database at $SAMYARD_DIR/state/jobs.db"
            find "$SAMYARD_DIR" 2>/dev/null | head -10
            exit 1
          fi
          echo "✅ ${{ matrix.platform }}-${{ matrix.arch }}: packaged app booted, server responded, and the yard opened its database."

      # PHASE 5 — prove notarization actually STUCK when signing is configured. If the Apple secrets are
      # present but Gatekeeper/stapler reject the build, fail the release loudly (a silently-broken
      # notarization is worse than an honest unsigned build). When unsigned, this skips cleanly.
      - name: Verify signature + notarization (macOS)
        if: matrix.platform == 'mac'   # both arches — spctl/stapler don't run the app, so x64 verifies fine too
        shell: bash
        env:
          HAVE_CERT: ${{ secrets.CSC_LINK != '' }}
        run: |
          APP=$(find dist-app -maxdepth 4 -name 'SAM.app' | head -1)
          DMG=$(find dist-app -maxdepth 1 -name '*.dmg' | head -1)
          if [ "$HAVE_CERT" != "true" ]; then echo "ℹ️ unsigned build (no CSC_LINK secret) — notarization check skipped, checksum-verify path stands."; exit 0; fi
          # HARD GATE: the app must be notarized (Gatekeeper's real requirement — clean open for any
          # online user, which is every install-time scenario). A silently-broken notarization fails loudly.
          echo "🔎 Gatekeeper assessment:"; spctl -a -vv --type exec "$APP" 2>&1 | tee /tmp/spctl.txt || true
          grep -qiE "source=Notarized Developer ID|accepted" /tmp/spctl.txt || { echo "❌ Gatekeeper did NOT accept the app — notarization didn't stick."; exit 1; }
          # SOFT CHECK: electron-builder notarizes+staples the .app but not the .dmg WRAPPER (the dmg
          # itself is never submitted to notary). The app is notarized, so it opens clean online; a
          # stapled dmg only helps FULLY-OFFLINE first-open. Warn, don't fail. (True dmg staple = v1.5.x.)
          echo "🔎 Stapler validate (dmg):"; if xcrun stapler validate "$DMG"; then echo "✅ dmg stapled — clean even offline."; else echo "⚠️ dmg not stapled (app IS notarized → clean online; offline-open staple is a follow-up)."; fi
          echo "✅ signed + notarized (app) — ships with zero Gatekeeper warning."

      # PUBLISH — the last thing that happens, and only once the app has been PROVEN to start.
      # Everything above is local: package, boot it, check notarization stuck. Only then do the
      # bytes leave the runner. This is the step whose absence let v3.2.0 reach users.
      #
      # electron-builder is not used to upload, because re-invoking it to publish would re-run the
      # build. The installers and the update feeds are already sitting in dist-app; they just need
      # attaching to the release.
      - name: Publish to the release
        if: ${{ github.event_name == 'release' || inputs.publish }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="${{ github.event.release.tag_name }}"
          # workflow_dispatch has no release payload — derive the tag the same way the version does.
          [ -n "$TAG" ] || TAG="v$(node -p "require('./package.json').version")"
          echo "publishing $TAG from $(pwd)/dist-app"

          # THE UPDATE FEEDS ARE NOT OPTIONAL. electron-updater reads latest*.yml; without them a
          # release installs fine by hand and then never offers anyone an update again — which is
          # silent, and is precisely how the cask sat at v1.5.0 for six months. If `--publish never`
          # ever stops emitting them, fail here rather than ship a release that quietly strands
          # every existing install.
          shopt -s nullglob
          feeds=(dist-app/latest*.yml)
          if [ ${#feeds[@]} -eq 0 ]; then
            echo "::error title=No update feed::electron-builder produced no latest*.yml under dist-app, so auto-update would silently stop working for everyone already on SAM. Refusing to publish."
            ls -la dist-app || true
            exit 1
          fi

          assets=(dist-app/*.dmg dist-app/*.zip dist-app/*.exe dist-app/*.AppImage dist-app/*.deb dist-app/*.blockmap "${feeds[@]}")
          if [ ${#assets[@]} -eq 0 ]; then
            echo "::error title=Nothing to publish::no installers found under dist-app."; exit 1
          fi
          printf 'uploading: %s\n' "${assets[@]}"
          gh release upload "$TAG" "${assets[@]}" -R "$REPO" --clobber

          # THE FEED MUST POINT AT FILES THAT EXIST. GitHub rewrites characters it dislikes in an
          # asset name — spaces become dots — so a file called "SAM Setup 3.2.2.exe" on disk lands
          # as "SAM.Setup.3.2.2.exe", while latest.yml still names "SAM-Setup-3.2.2.exe". Nothing
          # fails: the upload succeeds, the release looks complete, and every Windows auto-update
          # then 404s while the one-paste installer reports no installer found. v3.2.2 shipped
          # exactly that way. Compare what the feed promises against what is actually attached.
          published="$(gh release view "$TAG" -R "$REPO" --json assets -q '.assets[].name')"
          missing=0
          for feed in "${feeds[@]}"; do
            while read -r want; do
              [ -n "$want" ] || continue
              if ! printf '%s\n' "$published" | grep -Fxq "$want"; then
                echo "::error title=Update feed points at a missing asset::$(basename "$feed") references '$want', which is not attached to $TAG. Auto-update would 404 for everyone on this platform."
                missing=1
              fi
            done < <(grep -oE '^[[:space:]]*(-[[:space:]]+)?(url|path):[[:space:]]*\S+' "$feed" | sed -E 's/.*:[[:space:]]*//' | sort -u)
          done
          [ "$missing" -eq 0 ] || { echo "attached assets were:"; printf '%s\n' "$published"; exit 1; }

          echo "✅ ${{ matrix.platform }}-${{ matrix.arch }} published to $TAG — proven to boot, and the feed resolves."

      - name: Upload installers as artifacts (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: sam-${{ matrix.platform }}-${{ matrix.arch }}   # unique per platform+arch
          path: |
            dist-app/*.dmg
            dist-app/*.exe
            dist-app/*.AppImage
            dist-app/*.deb
            dist-app/*.blockmap
            dist-app/latest*.yml
          if-no-files-found: warn

  # After all platforms build + publish, compute SHA-256 of every installer and append a
  # "Verify your download" section to the release notes. Idempotent (skips if already present).
  checksums:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: SHA-256 checksums → release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -e
          gh release view "$TAG" -R "$REPO" --json body -q .body > existing.md
          if grep -q "Verify your download" existing.md; then
            echo "checksums already in notes — skipping"; exit 0
          fi
          mkdir dl && cd dl
          gh release download "$TAG" -R "$REPO" -p '*.dmg' -p '*.exe' -p '*.AppImage' -p '*.deb'
          # SHA256SUMS.txt — uploaded as a release asset so install.sh / install.ps1 can verify downloads.
          sha256sum * > SHA256SUMS.txt
          gh release upload "$TAG" -R "$REPO" SHA256SUMS.txt --clobber
          # ── Repair the mac update feed ───────────────────────────────────────
          # The two mac jobs (arm64, x64) each publish their OWN latest-mac.yml, and
          # whichever finishes last overwrites the other — so the feed describes ONE
          # architecture, picked by a race. v3.0.0 shipped arm64-only, which would have
          # handed every Intel Mac an Apple-silicon build it cannot run.
          #
          # This runs after BOTH builds, so it can name all of them. Only sha512s are
          # recomputed; nothing is rebuilt or re-signed.
          cd "$GITHUB_WORKSPACE/dl"
          gh release download "$TAG" -R "$REPO" -p '*-mac.zip' --clobber || true
          if ls *mac.zip >/dev/null 2>&1; then
            python3 - <<'FEED'
          import base64, hashlib, glob, os, datetime
          def sha(p):
              h = hashlib.sha512()
              with open(p, 'rb') as f:
                  for c in iter(lambda: f.read(1 << 20), b''): h.update(c)
              return base64.b64encode(h.digest()).decode()

          ver = os.environ['TAG'].lstrip('v')
          mac = sorted(glob.glob('*mac.zip') + [d for d in glob.glob('*.dmg') if 'Setup' not in d])
          if not mac:
              raise SystemExit('no mac artifacts — leaving the feed alone')

          lines = ['version: ' + ver, 'files:']
          for f in mac:
              lines += ['  - url: ' + f, '    sha512: ' + sha(f), '    size: ' + str(os.path.getsize(f))]

          # The fallback `path` is the x64 zip on purpose: Apple silicon runs an x64 build
          # under Rosetta, whereas an Intel Mac cannot run arm64 at all. If a client matches
          # nothing, the safe guess is the one that works everywhere.
          fb = next((f for f in mac if 'arm64' not in f and f.endswith('mac.zip')), mac[0])
          lines += ['path: ' + fb, 'sha512: ' + sha(fb),
                    "releaseDate: '" + datetime.datetime.now(datetime.timezone.utc).replace(tzinfo=None).isoformat(timespec='milliseconds') + "Z'"]
          open('latest-mac.yml', 'w').write('\n'.join(lines) + '\n')
          print('rebuilt latest-mac.yml naming: ' + ', '.join(mac))
          FEED
            gh release upload "$TAG" -R "$REPO" latest-mac.yml --clobber
            echo "OK mac update feed now names every architecture"
          else
            echo "WARN no mac zips found - feed left as electron-builder wrote it"
          fi
          # Append the verify block to the notes. existing.md and SHA256SUMS.txt both live under
          # $GITHUB_WORKSPACE (existing.md at the root, SHA256SUMS.txt in dl/) — build combined.md
          # there with one consistent cwd. The prior version cd'd to $WS then `cat SHA256SUMS.txt`
          # (which is in dl/) under `set -e`, so this step failed on every release after uploading
          # the sums + feed. Nothing above this line changed, so the critical assets still publish.
          cd "$GITHUB_WORKSPACE"
          {
            echo "## 🔒 Verify your download (SHA-256)"
            echo ""
            echo "The one-paste installers verify this automatically. To check by hand, compute the hash and match:"
            echo "- **macOS/Linux:** \`shasum -a 256 <file>\`"
            echo "- **Windows (PowerShell):** \`Get-FileHash <file> -Algorithm SHA256\`"
            echo ""
            echo '```'
            cat dl/SHA256SUMS.txt
            echo '```'
          } > sums.md
          { cat existing.md; echo ""; echo "---"; echo ""; cat sums.md; } > combined.md
          gh release edit "$TAG" -R "$REPO" --notes-file combined.md
          echo "✓ checksums (notes + SHA256SUMS.txt asset) published for $TAG"
          # Homebrew cask — auto-bump the tap so `brew install --cask richhabits/tap/sam` tracks releases.
          # Runs only if HOMEBREW_TAP_TOKEN (a PAT with write to richhabits/homebrew-tap) is set — else skips.
          if [ -n "${HOMEBREW_TAP_TOKEN:-}" ]; then
            V="${TAG#v}"
            ARM=$(grep -iE "arm64\.dmg" dl/SHA256SUMS.txt | grep -oiE '[a-f0-9]{64}' | head -1)
            INTEL=$(grep -iE "SAM-${V}\.dmg" dl/SHA256SUMS.txt | grep -oiE '[a-f0-9]{64}' | head -1)
            cat > sam.rb <<CASK
          cask "sam" do
            version "${V}"
            on_arm do
              sha256 "${ARM}"
              url "https://github.com/${REPO}/releases/download/v#{version}/SAM-#{version}-arm64.dmg"
            end
            on_intel do
              sha256 "${INTEL}"
              url "https://github.com/${REPO}/releases/download/v#{version}/SAM-#{version}.dmg"
            end
            name "SAM"
            desc "Free, private, local-first AI assistant that actually does the work"
            homepage "https://github.com/${REPO}"
            app "SAM.app"
          end
          CASK
            git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/richhabits/homebrew-tap.git" tap 2>/dev/null && {
              mkdir -p tap/Casks; cp sam.rb tap/Casks/sam.rb
              cd tap && git config user.name "sam-bot" && git config user.email "sam@hectic" \
                && git add Casks/sam.rb && git commit -m "sam ${V}" && git push && echo "✓ Homebrew cask bumped to ${V}"
            } || echo "⚠ tap push skipped (repo/token issue)"
          else
            # No token, and that is now FINE — the tap updates itself. richhabits/homebrew-tap
            # carries .github/workflows/bump-cask.yml, which checks this repo's latest release
            # hourly and rewrites Casks/sam.rb using the SHA256SUMS.txt the release publishes.
            # A workflow living in the repo it writes to needs no cross-repo PAT at all, so there
            # is nothing to provision, rotate, or forget.
            #
            # That matters because this step was an "ℹ️" nobody read: it silently no-op'd for six
            # months while the cask sat at v1.5.0 and releases went to v3.1.1 — brew served an
            # ancient build and every release still looked green. The token path is kept because
            # it publishes IMMEDIATELY rather than within the hour, but it is now an optimisation
            # rather than the only thing standing between users and a stale install.
            echo "::notice title=Homebrew cask left to the tap::HOMEBREW_TAP_TOKEN is not set, so this run did not push the cask. richhabits/homebrew-tap will pick ${TAG} up within the hour via its own bump-cask workflow. Set the PAT only if you want the cask to land the moment the release does."
          fi

  # PHASE 1 — clean-machine install test: run the ACTUAL one-paste installers from scratch on fresh
  # macOS/Windows/Ubuntu runners against the just-published release. Install must succeed on all three
  # or the release is marked failed. (SAM_NO_LAUNCH=1 → install silently, don't open the GUI.)
  install-test:
    needs: checksums
    if: github.event_name == 'release'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      SAM_NO_LAUNCH: "1"
      # Authenticate install.sh's GitHub API call — hosted macOS runners share an egress IP that's
      # chronically rate-limited (403) for UNauthenticated api.github.com. Real users need no token.
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - name: One-paste install (${{ matrix.os }})
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            pwsh -ExecutionPolicy Bypass -File docs/install.ps1
          else
            bash docs/install.sh
          fi
      - name: Verify SAM landed
        shell: bash
        run: |
          case "${{ runner.os }}" in
            macOS)   test -d "/Applications/SAM.app" && echo "✅ SAM.app installed on macOS";;
            Linux)   test -x "$HOME/.local/bin/SAM.AppImage" && echo "✅ AppImage installed on Linux";;
            Windows) if ls "$LOCALAPPDATA/Programs" 2>/dev/null | grep -qi sam; then echo "✅ SAM installed on Windows (LOCALAPPDATA/Programs)"; else echo "❌ not found"; ls "$LOCALAPPDATA/Programs" 2>/dev/null; exit 1; fi;;
          esac
