name: SAM Fix

# Label an issue `sam-fix` and SAM attempts a fix on its own free brain, PROVES it with the full
# test suite, and opens a DRAFT PR only if everything passes. A failed attempt just comments what it
# tried — nothing broken can reach main. Free: free Actions minutes + free Groq tier. See
# scripts/sam-fix.mjs for the safety model.
on:
  issues:
    types: [labeled]

concurrency:
  group: sam-fix-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  fix:
    if: github.event.label.name == 'sam-fix'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write         # push the fix branch
      pull-requests: write     # open the draft PR
      issues: write            # comment the outcome
    steps:
      # Push/open the PR as SAM_BOT_PAT when it's set AND actually works, so the branch push
      # fires a REAL pull_request CI run that branch protection counts — then the PR merges on
      # green with a normal click. `||` only covers the secret being UNSET; a secret that exists
      # but is expired or revoked (a PAT this old eventually will be) makes checkout itself fail
      # with a git auth error, and the run used to just die there with no trace anywhere a human
      # would see it — the whole automation silently stopped working weeks before anyone noticed.
      # continue-on-error + a guarded retry step turns that into the SAME degraded-but-working
      # path the comment below already documents for "no PAT set", instead of a dead end.
      - name: Checkout (SAM_BOT_PAT)
        id: checkout_pat
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.SAM_BOT_PAT || secrets.GITHUB_TOKEN }}
      - name: Checkout (SAM_BOT_PAT didn't authenticate — falling back to the built-in token)
        if: steps.checkout_pat.outcome == 'failure'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Which credential actually got us in
        id: cred
        run: |
          if [ "${{ steps.checkout_pat.outcome }}" = "failure" ]; then
            echo "token=github_token" >> "$GITHUB_OUTPUT"
            {
              echo "note<<SAMFIXEOF"
              echo "⚠️ \`SAM_BOT_PAT\` failed to authenticate (most likely expired or revoked) — this run fell back to the built-in Actions token. Its checks won't count toward branch protection (a bot-token push can't trigger that), so this one needs an admin merge. Rotate \`SAM_BOT_PAT\` under Settings → Secrets and variables → Actions to restore the normal path."
              echo "SAMFIXEOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "token=sam_bot_pat" >> "$GITHUB_OUTPUT"
            echo "note=" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci

      - name: Attempt a fix on SAM's free brain
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: node scripts/sam-fix.mjs

      - name: Open a draft PR, or comment why not
        env:
          # Whichever token actually got checkout working — using the dead PAT here too would
          # just move the same auth failure from git to the gh CLI instead of fixing anything.
          GH_TOKEN: ${{ steps.cred.outputs.token == 'github_token' && secrets.GITHUB_TOKEN || secrets.SAM_BOT_PAT }}
          # Built-in token for the issue comments — it has issues:write, so the PAT needs only
          # Contents + Pull requests, nothing more.
          COMMENT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CRED_NOTE: ${{ steps.cred.outputs.note }}
          N: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          STATUS=$(jq -r .status fix-result.json)
          echo "result: $(cat fix-result.json)"

          if [ "$STATUS" = "applied" ]; then
            SUMMARY=$(jq -r .summary fix-result.json)
            BRANCH="sam-fix/issue-${N}"
            git config user.name "sam-bot"
            git config user.email "sam-bot@users.noreply.github.com"

            # committing, pushing and opening the PR can each fail for reasons this automation
            # cannot fix itself (an expired bot credential, a protected branch, a network flake) —
            # set -e off for just this sequence so that outcome gets REPORTED, on the issue where a
            # human will actually see it, instead of the run just dying. Actions logs expire in
            # weeks (found the hard way: the run that first hit this had none left to read); an
            # issue comment doesn't.
            set +e
            git checkout -b "$BRANCH" \
              && git commit -am "SAM: ${SUMMARY} (for #${N})

          Auto-generated by SAM on its own free Groq brain, then verified with the full
          test suite (typecheck + tests + build). Draft — a human reviews before merge." \
              && git push -u origin "$BRANCH" --force-with-lease \
              && PR_URL=$(gh pr create -R "$REPO" --base main --head "$BRANCH" \
                   --title "SAM fix: ${SUMMARY} (closes #${N})" \
                   --body "SAM attempted this on its own free brain and \`npm run verify\` passed (typecheck + tests + build). **Please review before merging.** Closes #${N}.")
            PUBLISHED=$?
            set -e

            if [ "$PUBLISHED" -eq 0 ]; then
              BODY="🤖 I took a shot at this on my free brain and the full test suite passed — opened ${PR_URL} for review. Once CI is green, merge it (or close it if it's off)."
              if [ -n "$CRED_NOTE" ]; then BODY="${BODY}

          ${CRED_NOTE}"; fi
              GH_TOKEN="$COMMENT_TOKEN" gh issue comment "$N" -R "$REPO" --body "$BODY"
            else
              BODY="🤖 I built a fix and the full test suite passed, but I couldn't publish it — committing, pushing, or opening the PR failed. My change never left this run's disposable workspace, so nothing was pushed or lost."
              if [ -n "$CRED_NOTE" ]; then
                BODY="${BODY}

          ${CRED_NOTE}"
              else
                BODY="${BODY} This is usually \`SAM_BOT_PAT\`: check it hasn't expired or been revoked at github.com/settings/tokens, and that it's still current under this repo's Settings → Secrets and variables → Actions."
              fi
              BODY="${BODY}

          Fix the credential, then remove and re-add the \`sam-fix\` label to try again."
              GH_TOKEN="$COMMENT_TOKEN" gh issue comment "$N" -R "$REPO" --body "$BODY"
            fi
          elif [ "$STATUS" = "fail" ]; then
            REASON=$(jq -r .reason fix-result.json)
            TAIL=$(jq -r '.verifyTail // ""' fix-result.json)
            git checkout -- . || true
            BODY="🤖 I tried this on my free brain but backed off: ${REASON}"
            if [ -n "$TAIL" ]; then BODY="${BODY}

          <details><summary>what the tests said</summary>

          \`\`\`
          ${TAIL}
          \`\`\`
          </details>"; fi
            GH_TOKEN="$COMMENT_TOKEN" gh issue comment "$N" -R "$REPO" --body "$BODY"
          else
            REASON=$(jq -r '.reason // "skipped"' fix-result.json)
            echo "Skipping: $REASON"
            GH_TOKEN="$COMMENT_TOKEN" gh issue comment "$N" -R "$REPO" --body "🤖 I looked at this on my free brain but didn't attempt a fix: ${REASON}"
          fi
