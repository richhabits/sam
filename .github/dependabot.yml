version: 2
# Monthly + GROUPED updates: a few PRs instead of a flood that each trigger a full CI run.
# Keeps deps current without munching Actions minutes.
#
# MAJORS ARE KEPT SEPARATE, and that split is load-bearing rather than tidiness. A single
# `patterns: ["*"]` group put every bump in one PR — and August's landed as 21 packages
# including express 4→5, react 18→19, typescript 5.9→7.0 and better-sqlite3 12→13. It
# segfaulted CI (exit 139 on macOS and Linux, a native-module crash), so it could never be
# merged, and because the group was all-or-nothing it took the security patches down with it:
# the @hono/node-server advisory sat unmergeable behind eight major upgrades for a month.
#
# Split this way, the minor/patch PR stays boring and mergeable — which is exactly the PR
# security fixes arrive in — while majors get their own PR to be taken one at a time.
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    labels: ["dependencies"]
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      npm-major:
        patterns: ["*"]
        update-types: ["major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    labels: ["dependencies"]
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      actions-major:
        patterns: ["*"]
        update-types: ["major"]

  - package-ecosystem: "npm"
    directory: "/mobile"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    labels: ["dependencies", "mobile"]
    # Expo pins react, react-native and the expo-* native modules per SDK release
    # (expo/bundledNativeModules.json). Bumping them one by one breaks the native build even
    # when the JS tests pass (seen 2026-10-01: RN 0.87 / SDK 58 modules on an SDK 57 app).
    # Those move together, through `npx expo install --fix` during a deliberate SDK upgrade.
    ignore:
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "react-native"
      - dependency-name: "@types/react"
      - dependency-name: "expo-*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "expo"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      mobile-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      mobile-major:
        patterns: ["*"]
        update-types: ["major"]
