name: SAM
options:
  bundleIdPrefix: com.hectic.sam
  deploymentTarget:
    macOS: "26.0"
    iOS: "26.0"
    visionOS: "26.0"
    watchOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: CC9Q9BH5NT
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "113"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    SWIFT_EMIT_LOC_STRINGS: YES

packages:
  SAMKit:
    path: Packages/SAMKit

targets:
  # One native SwiftUI app for iPhone, iPad, Mac and Apple Vision Pro.
  # Same bundle id as the App Store app, so this ships as an update to it.
  SAM:
    type: application
    supportedDestinations: [iOS, macOS, visionOS]
    sources:
      - App
      - path: Privacy/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: SAMKit
      - target: SAMWidgets
        platformFilters: [iOS, macOS]
      - target: SAMWatch
        platformFilters: [iOS]
      - target: SAMSafari
        platformFilters: [iOS, macOS]
      - target: SAMShare
        platformFilters: [iOS, macOS]
    info:
      path: App/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: SAM
        SAMKeychainGroup: $(AppIdentifierPrefix)com.hectic.sam.shared
        LSApplicationCategoryType: public.app-category.productivity
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: SAM listens when you tap the microphone so you can talk instead of type.
        NSSpeechRecognitionUsageDescription: SAM turns what you say into text, on this device when it can.
        NSCameraUsageDescription: SAM uses the camera to scan the pairing code your Mac shows.
        NSPhotoLibraryAddUsageDescription: SAM saves pictures you make in Studio to your library. It can add photos, never read them.
        NSFaceIDUsageDescription: SAM can require Face ID before it opens, because it can act on your Mac.
        NSLocalNetworkUsageDescription: SAM finds and connects to the Mac running SAM on your network.
        NSBonjourServices: [_sam._tcp]
        # Paired Macs are reached by IP (LAN, or Tailscale 100.x). NSAllowsLocalNetworking covers IP
        # addresses and .local names; NSAllowsArbitraryLoads is ignored once it's present.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSUserActivityTypes: [com.hectic.sam.chat]
        NSServices:
          - NSMenuItem: { default: Ask SAM }
            NSMessage: askSAM
            NSPortName: SAM
            NSSendTypes: [public.utf8-plain-text, NSStringPboardType]
            NSRequiredContext: {}
        CFBundleURLTypes:
          - CFBundleURLName: com.hectic.sam
            CFBundleURLSchemes: [sam]
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSHumanReadableCopyright: © 2026 Romeo Valentine
    entitlements:
      path: App/SAM.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.device.audio-input: true
        com.apple.security.device.camera: true
        com.apple.security.personal-information.photos-library: true
        com.apple.security.application-groups: [group.com.hectic.sam.mobile]
        keychain-access-groups: [$(AppIdentifierPrefix)com.hectic.sam.shared]
    settings:
      base:
        PRODUCT_NAME: SAM
        PRODUCT_BUNDLE_IDENTIFIER: com.hectic.sam.mobile
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": App/SAM-macOS.entitlements
        TARGETED_DEVICE_FAMILY: "1,2,7"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        "ASSETCATALOG_COMPILER_APPICON_NAME[sdk=xros*]": VisionAppIcon
        "ASSETCATALOG_COMPILER_APPICON_NAME[sdk=xrsimulator*]": VisionAppIcon
        ENABLE_HARDENED_RUNTIME: YES

  # Widgets (Home Screen, Lock Screen, StandBy, Mac desktop) + Control Center control.
  SAMWidgets:
    type: app-extension
    supportedDestinations: [iOS, macOS]
    sources:
      - Widgets
      - path: Privacy/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: SAMKit
    entitlements:
      path: Widgets/SAMWidgets.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups: [group.com.hectic.sam.mobile]
        keychain-access-groups: [$(AppIdentifierPrefix)com.hectic.sam.shared]
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: SAM
        SAMKeychainGroup: $(AppIdentifierPrefix)com.hectic.sam.shared
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_NAME: SAMWidgets
        PRODUCT_BUNDLE_IDENTIFIER: com.hectic.sam.mobile.widget
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Widgets/SAMWidgets-macOS.entitlements

  # Safari Web Extension (iOS, iPadOS, macOS): "Ask SAM about this page".
  # The popup hands the page to the native handler; the token stays in the Keychain.
  SAMSafari:
    type: app-extension
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Safari
        excludes: [WebExtension/**]
      # Web files must sit at the bundle root (manifest.json first); subfolders stay folders.
      - path: Safari/WebExtension
        excludes: [images/**, _locales/**]
        buildPhase: resources
      - path: Safari/WebExtension/images
        type: folder
        buildPhase: resources
      - path: Safari/WebExtension/_locales
        type: folder
        buildPhase: resources
      - path: Privacy/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: SAMKit
    entitlements:
      path: Safari/SAMSafari.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.application-groups: [group.com.hectic.sam.mobile]
        keychain-access-groups: [$(AppIdentifierPrefix)com.hectic.sam.shared]
    info:
      path: Safari/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: SAM
        SAMKeychainGroup: $(AppIdentifierPrefix)com.hectic.sam.shared
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.web-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SafariWebExtensionHandler
    settings:
      base:
        PRODUCT_NAME: SAMSafari
        PRODUCT_BUNDLE_IDENTIFIER: com.hectic.sam.mobile.safari
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Safari/SAMSafari-macOS.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_HARDENED_RUNTIME: YES

  # Share extension (iOS, iPadOS, macOS): send text, a link, a photo or a PDF to SAM from any app.
  # Photos (Vision OCR) and PDFs (PDFKit) are read on-device; outside content goes untrusted.
  SAMShare:
    type: app-extension
    supportedDestinations: [iOS, macOS]
    sources:
      - Share
      - path: Privacy/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: SAMKit
    entitlements:
      path: Share/SAMShare.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.application-groups: [group.com.hectic.sam.mobile]
        keychain-access-groups: [$(AppIdentifierPrefix)com.hectic.sam.shared]
    info:
      path: Share/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: SAM
        SAMKeychainGroup: $(AppIdentifierPrefix)com.hectic.sam.shared
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            # Text, one web link, one image or one PDF: only what SharedContent can actually read.
            NSExtensionActivationRule: >-
              SUBQUERY(extensionItems, $item, SUBQUERY($item.attachments, $a,
              ANY $a.registeredTypeIdentifiers UTI-CONFORMS-TO "public.plain-text" OR
              ANY $a.registeredTypeIdentifiers UTI-CONFORMS-TO "public.url" OR
              ANY $a.registeredTypeIdentifiers UTI-CONFORMS-TO "public.image" OR
              ANY $a.registeredTypeIdentifiers UTI-CONFORMS-TO "com.adobe.pdf").@count == 1).@count == 1
    settings:
      base:
        PRODUCT_NAME: SAMShare
        PRODUCT_BUNDLE_IDENTIFIER: com.hectic.sam.mobile.share
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Share/SAMShare-macOS.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_HARDENED_RUNTIME: YES

  # Apple Watch: ask SAM by voice through the iPhone (WatchConnectivity), yard at a glance.
  SAMWatch:
    type: application
    platform: watchOS
    sources:
      - Watch
      - path: Privacy/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: SAMKit
      - target: SAMWatchWidgets
    info:
      path: Watch/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: SAM
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.hectic.sam.mobile
    entitlements:
      path: Watch/SAMWatch.entitlements
      properties:
        com.apple.security.application-groups: [group.com.hectic.sam.mobile]
    settings:
      base:
        PRODUCT_NAME: SAM
        PRODUCT_BUNDLE_IDENTIFIER: com.hectic.sam.mobile.watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  # Watch face complications + Smart Stack.
  SAMWatchWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - WatchWidgets
      - path: Privacy/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: SAMKit
    entitlements:
      path: WatchWidgets/SAMWatchWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.hectic.sam.mobile]
    info:
      path: WatchWidgets/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: SAM
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_NAME: SAMWatchWidgets
        PRODUCT_BUNDLE_IDENTIFIER: com.hectic.sam.mobile.watchkitapp.widgets

schemes:
  SAM:
    build:
      targets:
        SAM: all
    run:
      config: Debug
